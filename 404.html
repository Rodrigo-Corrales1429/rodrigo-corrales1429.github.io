<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valquiria Inc.</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages sirve este archivo ante cualquier ruta que no exista. El
     sitio entero vive en index.html con router de hash, así que aquí no hay
     nada que decidir: se devuelve al visitante a la raíz y la aplicación se
     encarga. El redirect va en <script> y no en un meta refresh porque así
     no deja una entrada extra en el historial: el botón "atrás" del navegador
     lleva a donde el visitante estaba, no de vuelta al 404. -->
<script>location.replace('/' + location.hash);</script>
<style>
  html,body{height:100%;margin:0;background:#060606;color:#c9a84c;
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  div{height:100%;display:flex;align-items:center;justify-content:center;
    letter-spacing:.22em;font-size:13px;text-transform:uppercase}
</style>
</head>
<body>
<div>Volviendo a Valquiria… <a href="/" style="color:#c9a84c;margin-left:.6em">Inicio</a></div>
</body>
</html>
